name: "ACU CSE 101 - TA Automated Grading"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Student PR
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Course Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run TA Review Action
        uses: acibadam-cse/acu-cse-101-ta-review-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          week: "auto"
          record-submission-branch: "true"
